name: Daily Soccer Data Scraper

on:
  schedule:
    # 每天 UTC 20:23 執行（即香港時間凌晨 04:23，避開整點擁擠）
    - cron: '23 20 * * *'
  # 允許在 GitHub 網頁手動點擊按鈕測試執行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        run: python src/scraper.py

      - name: Commit and push updated SQLite DB
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/soccer.db
          if ! git diff --staged --quiet; then
            git commit -m "chore: update soccer.db [skip ci]"
            git push
          else
            echo "No database changes to commit."
          fi